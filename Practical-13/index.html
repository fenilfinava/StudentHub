<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Practical 13</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <!-- Top Bar with Enhanced Visual Hierarchy -->
    <div class="top-bar">
        <div class="title-area">
            <h1>
                Student Management System
                <span class="tag-spa">AJAX / Fetch API</span>
            </h1>
            <p>
                StudentHub Asynchronous Portal | CSPIT - CHARUSAT (Practical 13)
            </p>
        </div>
        <div class="user-badge-cluster">
            <span class="badge badge-admin" id="roleBadge">👑 ADMIN PORTAL</span>
            <span class="user-name-pill" id="userNamePill">👤 fenilfinava (Admin)</span>
            <a href="../Practical-10/logout.php" class="btn-logout-pill">Logout ⎋</a>
        </div>
    </div>

    <!-- Attractive Dynamic RBAC Navigation Card -->
    <div class="nav-rbac-card">
        <div class="nav-rbac-header">
            <div class="nav-label-box">
                <strong>🧭 Dynamic RBAC Navigation:</strong>
                <span class="module-count" id="moduleCount">9 Modules Active</span>
            </div>
            <div class="role-switcher-box">
                <label for="roleSelector">Active Role:</label>
                <select id="roleSelector" onchange="handleRoleChange()">
                    <option value="user">👨‍🎓 Student (Read-Only)</option>
                    <option value="editor">👨‍🏫 Faculty (Edit Access)</option>
                    <option value="admin" selected>👑 Admin (Full Access)</option>
                </select>
            </div>
        </div>

        <ul class="nav-links-grid" id="dynamicMenu">
            <!-- Dynamically populated via script.js fetch() with icon pills -->
        </ul>
    </div>

    <!-- Live Asynchronous Notification Alert Banners -->
    <div id="statusAlert" style="display:none;"></div>

    <!-- Add / Edit Student Form Card -->
    <div class="card" id="formCard">
        <h2 id="formTitle">Add New Student</h2>
        
        <!-- Live RBAC Permission Warning Banner -->
        <div id="rbacNotice" style="display:none;"></div>

        <form id="crudForm" onsubmit="handleFormSubmit(event)">
            <input type="hidden" id="recordId">

            <div class="form-grid">
                <div>
                    <input type="text" id="recordName" placeholder="Full Name (e.g. Fenil Finava)" required>
                </div>
                <div>
                    <input type="email" id="recordEmail" placeholder="Email Address (e.g. fenil@charusat.edu.in)" required>
                </div>
                <div>
                    <select id="recordCourse" required>
                        <option value="">Select Course</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Data Science">Data Science</option>
                        <option value="Cyber Security">Cyber Security</option>
                    </select>
                </div>
                <div>
                    <select id="recordGender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <button type="submit" id="submitBtn" class="btn btn-success">+ Add Student</button>
                <button type="button" id="cancelBtn" class="btn btn-secondary" onclick="resetForm()" style="display:none;">Cancel Edit</button>
            </div>
        </form>
    </div>

    <!-- Student Records Table Card -->
    <div class="card" style="padding: 22px 22px 14px 22px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
            <h2 style="margin:0;">Student Records</h2>
            <button type="button" class="btn btn-secondary" style="padding:7px 16px; font-size:12.5px;" onclick="loadData()">🔄 Refresh Table</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 50px;">ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th style="width: 90px;">Gender</th>
                    <th style="width: 90px;">Status</th>
                    <th style="width: 140px;">Actions</th>
                </tr>
            </thead>
            <tbody id="itemsTableBody">
                <!-- Dynamically populated via script.js fetch() -->
            </tbody>
        </table>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
