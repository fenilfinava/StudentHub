<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Practical 13</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <!-- Top Bar matching Practical 11 and Practical 12 -->
    <div class="top-bar">
        <div>
            <h1>Student Management System</h1>
            <p style="margin:4px 0 0 0; color:#718096; font-size:13.5px;">
                Asynchronous CRUD & Dynamic Role-Based Access Control (Practical 13)
            </p>
        </div>
        <div class="user-badge">
            <span class="badge badge-admin" id="roleBadge">ADMIN PORTAL</span>
            <span style="font-size:13.5px; color:#4a5568;">👤 fenilfinava</span>
            <a href="../Practical-10/logout.php" class="btn btn-danger" style="padding:6px 14px; font-size:13px;">Logout</a>
        </div>
    </div>

    <!-- Dynamic Role-Based Access Control Navigation Bar -->
    <div class="nav-bar-container">
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <strong style="font-size:13px; color:#4a5568;">Navigation:</strong>
            <ul class="nav-links" id="dynamicMenu">
                <!-- Dynamically populated via script.js fetch() from api.php?action=get_menu -->
            </ul>
        </div>
        <div class="role-switcher">
            <label for="roleSelector">Active Role:</label>
            <select id="roleSelector" onchange="handleRoleChange()">
                <option value="user">Student</option>
                <option value="editor">Faculty</option>
                <option value="admin" selected>Admin</option>
            </select>
        </div>
    </div>

    <!-- Live Asynchronous Notification Alert Banners -->
    <div id="statusAlert" style="display:none;"></div>

    <!-- Add / Edit Student Section -->
    <div class="card">
        <h2 id="formTitle">Add New Student</h2>
        <form id="crudForm" onsubmit="handleFormSubmit(event)">
            <input type="hidden" id="recordId">

            <div class="form-grid">
                <div>
                    <input type="text" id="recordName" placeholder="Full Name (e.g. Fenil Finava)" required>
                </div>
                <div>
                    <input type="email" id="recordEmail" placeholder="Email Address (e.g. fenil@charusat.edu.in)" required>
                </div>
                <div>
                    <select id="recordCourse" required>
                        <option value="">Select Course</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Data Science">Data Science</option>
                        <option value="Cyber Security">Cyber Security</option>
                    </select>
                </div>
                <div>
                    <select id="recordGender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <button type="submit" id="submitBtn" class="btn btn-success">+ Add Student</button>
                <button type="button" id="cancelBtn" class="btn btn-secondary" onclick="resetForm()" style="display:none;">Cancel Edit</button>
            </div>
        </form>
    </div>

    <!-- Student Records Table Section -->
    <div class="card" style="padding: 20px 20px 10px 20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
            <h2 style="margin:0;">Student Records</h2>
            <button type="button" class="btn btn-secondary" style="padding:6px 14px; font-size:12.5px;" onclick="loadData()">🔄 Refresh Table</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 50px;">ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th style="width: 90px;">Gender</th>
                    <th style="width: 90px;">Status</th>
                    <th style="width: 140px;">Actions</th>
                </tr>
            </thead>
            <tbody id="itemsTableBody">
                <!-- Dynamically populated via script.js fetch() -->
            </tbody>
        </table>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
