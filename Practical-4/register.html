<!DOCTYPE html>
<html lang="en" class="auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - StudentHub</title>
    <!-- Premium Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --primary-dark: #1d4ed8; --bg: #f8fafc; --text: #334155; --border: #e2e8f0; --error: #ef4444; --success: #10b981; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%); margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; color: var(--text); }
        .register-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 700px; box-sizing: border-box;}
        h1 { margin-top: 0; color: #0f172a; text-align: center; margin-bottom: 30px;}
        
        .form-row { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;}
        .form-group { flex: 1; min-width: 250px; display: flex; flex-direction: column; }
        
        label { font-weight: 600; margin-bottom: 8px; color: #0f172a; }
        input[type="text"], input[type="email"], input[type="tel"], input[type="password"], select, input[type="number"] { padding: 12px 15px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 1rem; font-family: inherit; transition: 0.2s; outline: none; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        
        .error-msg { color: var(--error); font-size: 0.85rem; margin-top: 5px; min-height: 18px; font-weight: 500;}
        
        .gender-options { display: flex; gap: 15px; padding: 10px 0;}
        .gender-options label { font-weight: 400; cursor: pointer; display: flex; align-items: center; gap: 5px;}
        
        .terms-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .terms-group label { font-weight: 400; margin-bottom: 0; cursor: pointer; }
        
        .btn-submit { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 20px; font-family: inherit;}
        .btn-submit:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(37,99,235,0.3); }

        /* Password Strength */
        .strength-container { height: 6px; background: var(--border); border-radius: 10px; margin-top: 8px; overflow: hidden; width: 100%;}
        .strength-bar { height: 100%; width: 0%; transition: width 0.3s, background 0.3s; }
        .strength-text { font-size: 0.85rem; font-weight: 600; margin-top: 5px; text-align: right; }

        .back-link { display: block; text-align: center; margin-top: 20px; color: var(--primary); text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
    </style>
    <style>.auth-pending body { visibility: hidden; }</style>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/auth.js"></script>
</head>
<body>

    <div class="register-container">
        <h1>Student Registration</h1>
        <form id="registerForm" novalidate>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" name="name" placeholder="John Doe">
                    <div class="error-msg" id="nameError"></div>
                </div>
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" placeholder="john@charusat.edu.in">
                    <div class="error-msg" id="emailError"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="mobile">Mobile Number *</label>
                    <input type="tel" id="mobile" name="mobile" placeholder="9876543210" maxlength="10">
                    <div class="error-msg" id="mobileError"></div>
                </div>
                <div class="form-group">
                    <label>Gender *</label>
                    <div class="gender-options">
                        <label><input type="radio" name="gender" value="Male"> Male</label>
                        <label><input type="radio" name="gender" value="Female"> Female</label>
                        <label><input type="radio" name="gender" value="Other"> Other</label>
                    </div>
                    <div class="error-msg" id="genderError"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="course">Course *</label>
                    <select id="course" name="course">
                        <option value="">-- Select Course --</option>
                        <option value="BTech CSE">B.Tech - CSE</option>
                        <option value="BTech CE">B.Tech - CE</option>
                        <option value="BTech IT">B.Tech - IT</option>
                        <option value="BCA">BCA</option>
                    </select>
                    <div class="error-msg" id="courseError"></div>
                </div>
                <div class="form-group">
                    <label for="year">Admission Year *</label>
                    <select id="year" name="year">
                        <option value="">-- Select Year --</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                    <div class="error-msg" id="yearError"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" placeholder="Create a strong password">
                    <div class="strength-container"><div class="strength-bar" id="strengthBar"></div></div>
                    <div class="strength-text" id="strengthText"></div>
                    <div class="error-msg" id="passwordError"></div>
                </div>
                <div class="form-group">
                    <label for="cPassword">Confirm Password *</label>
                    <input type="password" id="cPassword" name="cPassword" placeholder="Re-enter password">
                    <div class="error-msg" id="cPasswordError"></div>
                </div>
            </div>

            <div class="terms-group">
                <input type="checkbox" id="terms" name="terms">
                <label for="terms">I agree to the Terms & Conditions and Privacy Policy.</label>
            </div>
            <div class="error-msg" id="termsError"></div>

            <button type="submit" class="btn-submit">Register Account</button>
        </form>
        <a href="login.html" class="back-link">&larr; Back to Login</a>
    </div>

    <script>
        // Password Strength Logic
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');

        passwordInput.addEventListener('input', function(e) {
            const val = e.target.value;
            let strength = 0;
            
            if (val.length >= 8) strength += 25;
            if (val.match(/[A-Z]/)) strength += 25;
            if (val.match(/[0-9]/)) strength += 25;
            if (val.match(/[@$!%*?&]/)) strength += 25;

            strengthBar.style.width = strength + '%';
            
            if (val.length === 0) {
                strengthBar.style.width = '0%';
                strengthText.innerText = '';
            } else if (strength < 50) {
                strengthBar.style.backgroundColor = 'red';
                strengthText.innerText = 'Weak';
                strengthText.style.color = 'red';
            } else if (strength < 100) {
                strengthBar.style.backgroundColor = 'orange';
                strengthText.innerText = 'Medium';
                strengthText.style.color = 'orange';
            } else {
                strengthBar.style.backgroundColor = '#10b981'; // Green
                strengthText.innerText = 'Strong';
                strengthText.style.color = '#10b981';
            }
        });

        // Form Validation Logic
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent default submission for JS validation
            
            let isValid = true;

            // Clear all error messages
            document.querySelectorAll('.error-msg').forEach(el => el.innerText = '');

            // 1. Name Validation (Letters and spaces only, min 3 chars)
            const name = document.getElementById('name').value.trim();
            const nameRegex = /^[a-zA-Z\s]{3,}$/;
            if (!nameRegex.test(name)) {
                document.getElementById('nameError').innerText = 'Please enter a valid name (letters only, min 3 chars).';
                isValid = false;
            }

            // 2. Email Validation
            const email = document.getElementById('email').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('emailError').innerText = 'Please enter a valid email address.';
                isValid = false;
            }

            // 3. Mobile Validation (Exactly 10 digits)
            const mobile = document.getElementById('mobile').value.trim();
            const mobileRegex = /^[0-9]{10}$/;
            if (!mobileRegex.test(mobile)) {
                document.getElementById('mobileError').innerText = 'Mobile number must be exactly 10 digits.';
                isValid = false;
            }

            // 4. Gender Validation
            const gender = document.querySelector('input[name="gender"]:checked');
            if (!gender) {
                document.getElementById('genderError').innerText = 'Please select your gender.';
                isValid = false;
            }

            // 5. Course & Year Validation
            const course = document.getElementById('course').value;
            if (course === "") {
                document.getElementById('courseError').innerText = 'Please select a course.';
                isValid = false;
            }
            const year = document.getElementById('year').value;
            if (year === "") {
                document.getElementById('yearError').innerText = 'Please select an admission year.';
                isValid = false;
            }

            // 6. Password Validation
            const password = document.getElementById('password').value;
            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            if (!passwordRegex.test(password)) {
                document.getElementById('passwordError').innerText = 'Password must be 8+ chars with uppercase, lowercase, number, and special character.';
                isValid = false;
            }

            // 7. Confirm Password Validation
            const cPassword = document.getElementById('cPassword').value;
            if (password !== cPassword || cPassword === "") {
                document.getElementById('cPasswordError').innerText = 'Passwords do not match.';
                isValid = false;
            }

            // 8. Terms Validation
            const terms = document.getElementById('terms').checked;
            if (!terms) {
                document.getElementById('termsError').innerText = 'You must accept the Terms & Conditions.';
                isValid = false;
            }

            // Final check
            if (isValid) {
                alert('Success! All validations passed. Registration successful!');
                window.location.href = 'login.html'; // Redirect on success
            }
        });
    </script>
    </body>
</html>
